<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header>
        <h1 id="appTitle"></h1>
        <select id="languageSelect" aria-label="Language"></select>
    </header>
    <p class="muted" id="tagline"></p>
    <div class="privacy-badge" id="privacyBadge"></div>

    <ol class="steps" id="stepsStrip">
        <li><span class="step-num">1</span><span id="stepAnon"></span></li>
        <li><span class="step-num">2</span><span id="stepUse"></span></li>
        <li><span class="step-num">3</span><span id="stepRestore"></span></li>
    </ol>

    <section id="llmSection">
        <label class="switch-row">
            <input type="checkbox" id="llmEnabled" />
            <span id="llmEnableLabel"></span>
        </label>
        <div id="llmStatus" class="muted small"></div>
        <div id="llmProgressWrap" class="progress hidden"><div id="llmProgressBar" class="progress-bar"></div></div>
        <div id="llmModelRow" class="hidden">
            <select id="llmModelSelect"></select>
            <button id="llmRecheck" class="ghost small-btn hidden"></button>
        </div>
    </section>

    <section>
        <label class="section-label" id="inputLabel" for="inputText"></label>
        <textarea id="inputText" rows="7"></textarea>
        <div class="btn-row">
            <button id="anonymizeBtn" class="primary"></button>
            <button id="pasteBtn" class="ghost"></button>
            <button id="clearBtn" class="ghost"></button>
        </div>
        <div id="llmErrorNote" class="warn small hidden"></div>
    </section>

    <section id="outputSection" class="hidden">
        <div id="sensitiveWarning" class="warn small hidden"></div>
        <div class="label-row">
            <span class="section-label" id="outputLabel"></span>
            <button id="copyOutputBtn" class="ghost small-btn"></button>
        </div>
        <textarea id="outputText" rows="7" readonly></textarea>
        <details id="mappingDetails" open>
            <summary id="mappingSummary"></summary>
            <div id="catSummary" class="cat-summary"></div>
            <table id="mappingTable"></table>
            <p class="muted small" id="mappingNote"></p>
        </details>
        <div id="allowedChips" class="chips hidden"></div>
    </section>

    <section id="deanonSection" class="hidden">
        <details>
            <summary id="deanonTitle"></summary>
            <div id="mappingLoadedNote" class="muted small hidden"></div>
            <textarea id="responseText" rows="5"></textarea>
            <div class="btn-row">
                <button id="deanonymizeBtn" class="primary"></button>
                <button id="copyRestoredBtn" class="ghost small-btn hidden"></button>
            </div>
            <div class="btn-row">
                <button id="exportMappingBtn" class="ghost small-btn"></button>
                <button id="importMappingBtn" class="ghost small-btn"></button>
                <button id="deleteMappingBtn" class="ghost small-btn"></button>
                <input type="file" id="mappingFile" accept=".json" class="hidden" />
            </div>
            <textarea id="restoredText" rows="5" readonly class="hidden"></textarea>
        </details>
    </section>

    <section id="imageSection">
        <details>
            <summary id="imageTitle"></summary>
            <p class="muted small" id="imageHint"></p>
            <div id="imageUnavailable" class="muted small hidden"></div>
            <div id="imageControls">
                <input type="file" id="imageFile" accept="image/*" />
                <div class="btn-row">
                    <button id="imageRunBtn" class="primary" disabled></button>
                </div>
                <div id="imageProgressWrap" class="progress hidden"><div id="imageProgressBar" class="progress-bar"></div></div>
                <div id="imageStatus" class="muted small"></div>
                <div id="imageSensitive" class="warn small hidden"></div>
                <div id="imageResult" class="hidden">
                    <canvas id="imageCanvas" class="redacted-canvas"></canvas>
                    <div class="btn-row">
                        <button id="imageDownloadBtn" class="ghost small-btn"></button>
                    </div>
                </div>
            </div>
        </details>
    </section>

    <section>
        <details>
            <summary id="settingsTitle"></summary>
            <div id="optionsGrid" class="options-grid"></div>
            <label class="section-label" id="termsLabel" for="customTerms"></label>
            <textarea id="customTerms" rows="3"></textarea>
            <label class="section-label" id="allowedLabel" for="allowedTerms"></label>
            <textarea id="allowedTerms" rows="3"></textarea>
        </details>
    </section>

    <footer class="muted small" id="footerNote"></footer>
    <div class="muted dsg-note" id="dsgNote"></div>

    <script type="module" src="popup.js"></script>
</body>
</html>
