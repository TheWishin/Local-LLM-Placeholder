name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DataAnonymizer.sln -c Release

      - name: Test
        run: dotnet run --project tests/DataAnonymizer.Tests -c Release --no-build
