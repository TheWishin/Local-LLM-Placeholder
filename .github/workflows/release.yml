name: Release

# Erstellt fertige Pakete für Windows, Linux und macOS sowie das ZIP der
# Browser-Erweiterung. Die Empfänger brauchen kein .NET – einfach entpacken
# und starten. Auslösen entweder durch Pushen eines Tags wie v1.0.0 oder
# manuell über "Run workflow" (der Tag wird dann automatisch erstellt).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z.B. v1.0.0'
        required: true

permissions:
  contents: write

# Achtung: nicht "VERSION" nennen – MSBuild interpretiert die Umgebungsvariable
# VERSION als .NET-Versionsnummer, und "v1.0.0" ist dafür ungültig.
env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet run --project tests/DataAnonymizer.Tests -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test browser extension engine
        run: |
          node extension/engine.test.mjs
          node extension/image.test.mjs
          node extension/pdf.test.mjs

      - name: OCR-Bausteine für die Bild-Anonymisierung holen
        run: bash scripts/fetch-ocr-assets.sh

      - name: Publish (alle Plattformen)
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            # ReadyToRun: IL wird vorab in nativen Code kompiliert – schnellerer
            # Start, u.a. nativ für Apple Silicon (osx-arm64, z.B. MacBook M-Serie).
            dotnet publish src/DataAnonymizer -c Release -r "$rid" --self-contained -p:PublishReadyToRun=true -o "publish/$rid"
            # Passenden One-Click-Installer + START-HERE beilegen, damit die
            # Empfänger nur eine Datei anklicken müssen (Ollama installiert sich selbst).
            case "$rid" in
              win-x64)
                cp installers/Install-Windows.bat "publish/$rid/"
                cp installers/START-HERE-Windows.txt "publish/$rid/START HERE.txt" ;;
              osx-x64|osx-arm64)
                cp installers/Install-macOS.command "publish/$rid/"
                chmod +x "publish/$rid/Install-macOS.command"
                cp installers/START-HERE-macOS.txt "publish/$rid/START HERE.txt" ;;
              linux-x64)
                cp installers/Install-Linux.sh "publish/$rid/"
                chmod +x "publish/$rid/Install-Linux.sh"
                cp installers/START-HERE-Linux.txt "publish/$rid/START HERE.txt" ;;
            esac
            (cd publish && zip -qr "../DataAnonymizer-${RELEASE_VERSION}-$rid.zip" "$rid")
          done

      # Hinweis: Das API-Gateway wird bewusst NICHT hier mitgeliefert. Es hat ein
      # eigenes, separates Release (Workflow release-gateway.yml, Tag gateway-v*),
      # damit dieses Release schlank bleibt und nur die beiden Alltags-Werkzeuge
      # enthält: die Desktop-App und die Browser-Erweiterung.

      - name: Browser-Erweiterung paketieren (Chrome/Edge, inkl. OCR-Dateien)
        run: |
          zip -qr "DataAnonymizer-${RELEASE_VERSION}-browser-extension.zip" extension \
            -x "extension/engine.test.mjs" "extension/image.test.mjs" "extension/pdf.test.mjs"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version || github.ref_name }} — ohne Gateway (App + Erweiterung)
          body: |
            Schlankes Release **OHNE Gateway**: nur die Desktop-App und die
            Browser-Erweiterung – die beiden Alltags-Werkzeuge.

            Wer zusätzlich das API-Gateway möchte, nimmt das Komplettpaket **mit
            Gateway** (Tag `gateway-v…`).
          files: DataAnonymizer-*.zip
          generate_release_notes: true
