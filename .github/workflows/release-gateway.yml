name: Release Gateway

# Eigenes, separates Release NUR für das API-Gateway (DataAnonymizer.Proxy).
# Die Desktop-App und die Browser-Erweiterung haben ihr eigenes Release
# (Workflow release.yml, Tag v*). So bleibt der Alltags-Download schlank und
# das Gateway ist ein klar getrennter, optionaler Baustein für API-Nutzung.
#
# Auslösen: Tag wie gateway-v1.7.1 pushen ODER manuell über "Run workflow"
# (der Tag wird dann automatisch erstellt).
on:
  push:
    tags: ['gateway-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Gateway-Version, z.B. gateway-v1.7.1'
        required: true

permissions:
  contents: write

# Nicht "VERSION" nennen – MSBuild würde die Umgebungsvariable als .NET-Version deuten.
env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (inkl. Gateway-Logik)
        run: dotnet run --project tests/DataAnonymizer.Tests -c Release

      - name: Gateway paketieren (alle Plattformen)
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/DataAnonymizer.Proxy -c Release -r "$rid" --self-contained -o "gateway/$rid"
            cp installers/GATEWAY-README.txt "gateway/$rid/README.txt"
            case "$rid" in
              win-x64)
                cp installers/Start-Gateway-Windows.bat "gateway/$rid/" ;;
              osx-x64|osx-arm64)
                cp installers/start-gateway-macOS.command "gateway/$rid/"
                chmod +x "gateway/$rid/start-gateway-macOS.command" ;;
              linux-x64)
                cp installers/start-gateway-Linux.sh "gateway/$rid/"
                chmod +x "gateway/$rid/start-gateway-Linux.sh" ;;
            esac
            (cd gateway && zip -qr "../DataAnonymizer-Gateway-${RELEASE_VERSION}-$rid.zip" "$rid")
          done

      - name: GitHub-Release (Gateway) erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version || github.ref_name }}
          body: |
            **Daten-Anonymisierer – API-Gateway** (separates Release).

            Ein lokaler, Anthropic-kompatibler Reverse-Proxy: der Client zeigt mit
            `ANTHROPIC_BASE_URL` auf das Gateway, vertrauliche Daten werden
            anonymisiert an den KI-Server geschickt und in der Antwort wieder
            eingesetzt (auch Streaming und SQL/Tool-Ausgaben).

            Passendes Paket für dein System herunterladen, entpacken und das
            Start-Skript ausführen. Details siehe `README.txt` im Paket.

            > Hinweis: Die offizielle Claude-Desktop/Web-App lässt sich technisch
            > nicht auf einen eigenen Server umleiten. Für die normale Nutzung sind
            > die **App** und die **Browser-Erweiterung** gedacht (eigenes Release).
          files: DataAnonymizer-Gateway-*.zip
