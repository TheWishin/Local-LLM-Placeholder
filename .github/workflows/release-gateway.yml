name: Release (mit Gateway)

# Komplettpaket MIT Gateway: Desktop-App + Browser-Erweiterung + API-Gateway
# in EINEM Release. Wer das Gateway nicht braucht, nimmt das schlanke Release
# OHNE Gateway (Workflow release.yml, Tag v*).
#
# Auslösen: Tag wie gateway-v1.7.2 pushen ODER manuell über "Run workflow".
on:
  push:
    tags: ['gateway-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version mit Gateway, z.B. gateway-v1.7.2'
        required: true

permissions:
  contents: write

# Nicht "VERSION" nennen – MSBuild würde die Umgebungsvariable als .NET-Version deuten.
env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release-with-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet run --project tests/DataAnonymizer.Tests -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test browser extension engine
        run: |
          node extension/engine.test.mjs
          node extension/image.test.mjs
          node extension/pdf.test.mjs

      - name: OCR-Bausteine für die Bild-Anonymisierung holen
        run: bash scripts/fetch-ocr-assets.sh

      # Für die Dateinamen das "gateway-" Präfix entfernen: gateway-v1.7.2 -> v1.7.2
      - name: Saubere Versionsbezeichnung für Dateinamen
        run: echo "V=${RELEASE_VERSION#gateway-}" >> "$GITHUB_ENV"

      - name: App publizieren (alle Plattformen)
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            # ReadyToRun: nativer Code vorab, schnellerer Start (u.a. Apple Silicon).
            dotnet publish src/DataAnonymizer -c Release -r "$rid" --self-contained -p:PublishReadyToRun=true -o "publish/$rid"
            case "$rid" in
              win-x64)
                cp installers/Install-Windows.bat "publish/$rid/"
                cp installers/START-HERE-Windows.txt "publish/$rid/START HERE.txt" ;;
              osx-x64|osx-arm64)
                cp installers/Install-macOS.command "publish/$rid/"
                chmod +x "publish/$rid/Install-macOS.command"
                cp installers/START-HERE-macOS.txt "publish/$rid/START HERE.txt" ;;
              linux-x64)
                cp installers/Install-Linux.sh "publish/$rid/"
                chmod +x "publish/$rid/Install-Linux.sh"
                cp installers/START-HERE-Linux.txt "publish/$rid/START HERE.txt" ;;
            esac
            (cd publish && zip -qr "../DataAnonymizer-${V}-$rid.zip" "$rid")
          done

      - name: Gateway publizieren (alle Plattformen)
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/DataAnonymizer.Proxy -c Release -r "$rid" --self-contained -p:PublishReadyToRun=true -o "gateway/$rid"
            cp installers/GATEWAY-README.txt "gateway/$rid/README.txt"
            case "$rid" in
              win-x64)
                cp installers/Start-Gateway-Windows.bat "gateway/$rid/" ;;
              osx-x64|osx-arm64)
                cp installers/start-gateway-macOS.command "gateway/$rid/"
                chmod +x "gateway/$rid/start-gateway-macOS.command" ;;
              linux-x64)
                cp installers/start-gateway-Linux.sh "gateway/$rid/"
                chmod +x "gateway/$rid/start-gateway-Linux.sh" ;;
            esac
            (cd gateway && zip -qr "../DataAnonymizer-Gateway-${V}-$rid.zip" "$rid")
          done

      - name: Browser-Erweiterung paketieren (Chrome/Edge, inkl. OCR-Dateien)
        run: |
          zip -qr "DataAnonymizer-${V}-browser-extension.zip" extension \
            -x "extension/engine.test.mjs" "extension/image.test.mjs" "extension/pdf.test.mjs"

      - name: GitHub-Release (mit Gateway) erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version || github.ref_name }} — mit Gateway (App + Erweiterung + Gateway)
          body: |
            **Komplettpaket MIT Gateway.** Enthält alles: die Desktop-App, die
            Browser-Erweiterung **und** das API-Gateway.

            Wer das Gateway nicht braucht, nimmt das schlanke Release **ohne
            Gateway** (Tag `v…`) – dort sind nur App und Erweiterung enthalten.

            Passendes Paket herunterladen, entpacken, Start-Skript ausführen.
            Das Gateway ist nur für die API-Nutzung nötig (nicht für die App/Erweiterung).
          files: DataAnonymizer-*.zip
